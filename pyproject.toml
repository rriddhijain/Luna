[project]
name = "samanvay"
version = "0.1.0"
description = "Lunar Image Registration Pipeline"
readme = "README.md"
requires-python = ">=3.10"
# The table form, not PEP 639's bare `license = "Apache-2.0"` string: that spelling needs
# hatchling >= 1.27 / setuptools >= 77, and neither this venv nor a judge's machine is
# guaranteed to have one. The table form has worked on every backend for years, and
# `pip install -e .` is step 1 of the quickstart.
license = { file = "LICENSE" }
# Floors, not pins. requirements.lock is the exact transitive closure and is what the
# image and CI install (`pip install --no-deps -r requirements.lock`); this list exists so
# a plain `pip install -e .` produces a working environment.
#
# scikit-image and matplotlib are NOT optional. Both are imported at module scope:
#   geometry/refine.py  -> from skimage.registration import phase_cross_correlation
#   match/detect.py     -> from skimage.feature import peak_local_max
#   report/render.py    -> import matplotlib
# Leaving them out meant `pip install -e .` produced a package that raised ImportError on
# the first registration. Verified against the installed versions in requirements.lock
# (scikit-image 0.26.0, matplotlib 3.11.1).
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "rasterio>=1.3.0",
    "pds4-tools>=1.3",
    "opencv-python-headless>=4.5.0",
    "scikit-image>=0.19.0",
    "matplotlib>=3.5.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
]

[project.scripts]
samanvay = "samanvay.pipeline.run:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
