[project]
name = "samanvay"
version = "0.1.0"
description = "Lunar Image Registration Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "rasterio>=1.3.0",
    "pds4-tools>=1.3",
    "opencv-python-headless>=4.5.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "kornia>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
]

[project.scripts]
samanvay = "samanvay.pipeline.run:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
