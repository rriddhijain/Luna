[project]
name = "samanvay"
version = "0.1.0"
description = "SAMANVAY — illumination-robust lunar image registration pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team SAMANVAY (SIH 2026)" }]
dependencies = [
    "numpy>=2.0,<2.3",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "opencv-contrib-python>=4.10",   # 'contrib' build is required for cv2.USAC_MAGSAC
    "matplotlib>=3.9",
    "rasterio>=1.3",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
samanvay = "samanvay.pipeline.run:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repo is a small monorepo: the `samanvay` package plus a handful of
# top-level modules the seats own (geometric_types is the frozen contract that
# samanvay.types re-exports; geometry/bench/synth are the geometry seat and the
# benchmark/fixture tooling). All of them must land in the wheel or a clean
# `pip install .` / `docker compose run` breaks on `import geometric_types`.
[tool.hatch.build.targets.wheel]
packages = ["samanvay", "geometry", "bench", "synth"]

[tool.hatch.build.targets.wheel.force-include]
"geometric_types.py" = "geometric_types.py"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Deterministic, meaningful set: pycodestyle/pyflakes (real errors + unused
# imports/names), import order, modern-Python and bugbear. Kept tight so
# "main is always green" is about correctness, not style bikeshedding.
select = ["E", "F", "I", "W", "B", "UP", "RUF"]
ignore = [
    "E501",   # line length is enforced softly, not as a hard gate
    "B008",   # click uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.pyright]
extraPaths = ["."]
