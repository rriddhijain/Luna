# SAMANVAY — Seat 5 · deployment. One command per artifact.
#
# A judge should not have to reconstruct a flag string from a README. Each service below
# produces exactly one thing and is run the same way:
#
#   docker compose build            # once
#   docker compose run --rm fixture     # -> fixtures/synth_pair_A/  (the pair to register)
#   docker compose run --rm demo        # -> runs/demo_01/           (the run artifacts)
#   docker compose run --rm ablate      # -> runs/ablate/ablation.md (the innovation table)
#   docker compose run --rm bench       # -> runs/sweep/bench.md     (accuracy vs delta-sun)
#   docker compose run --rm test        # the pytest suite, inside the image
#   docker compose run --rm airgap      # the no-external-URL / no-unlocked-import gate
#   docker compose up dashboard         # http://localhost:8000/viewer/
#
# `--rm` because these are one-shot jobs, not daemons; without it every run leaves a
# stopped container behind.
#
# Run fixture before demo/ablate: they register a pair that fixture writes.

x-samanvay: &samanvay
  build: .
  image: samanvay:local
  # The working directory is mounted, not baked: outputs land on the host where the judge
  # can open them, and re-running after an edit needs no rebuild. It shadows /app from the
  # image, which is what we want — the image supplies the interpreter and the wheels, the
  # mount supplies the code and the data.
  volumes:
    - .:/app
  working_dir: /app
  environment:
    MPLBACKEND: Agg          # also set in the image; repeated here so an override cannot lose it
    PYTHONPATH: /app
  # Container uid 1000 == the image's `samanvay` user. On Linux, set UID/GID in a .env file
  # if your host account is not 1000, or the mounted outputs come back owned by 1000.
  init: true                 # so Ctrl-C actually stops a long run

services:
  # The synthetic ground-truth pair everything else registers. Deterministic: seed 0
  # reproduces every byte.
  fixture:
    <<: *samanvay
    command: ["fixture", "--out-dir", "fixtures/synth_pair_A"]

  # The headline run: source + reference in, the run artifacts out. On the default
  # config this pair registers (measured 2026-09-03 outside the container: homography
  # +tps, 64 inliers, held-out check RMSE 1.5712 px, true gt_rmse 2.9287 px) and misses
  # the plan's 0.85 inlier ratio at 0.2936, which the CLI prints as FAIL. A non-zero exit
  # here means it did not register at all, not that it registered badly.
  demo:
    <<: *samanvay
    command:
      - register
      - --source
      - fixtures/synth_pair_A/source.tif
      - --ref
      - fixtures/synth_pair_A/reference.tif
      - --out
      - runs/demo_01

  # The innovation argument: the same pair, one stage switched off at a time.
  ablate:
    <<: *samanvay
    entrypoint: ["python", "-m", "bench.ablate"]
    command:
      - --source
      - fixtures/synth_pair_A/source.tif
      - --ref
      - fixtures/synth_pair_A/reference.tif
      - --out
      - runs/ablate

  # Accuracy against ground truth across the delta-sun-azimuth sweep.
  #
  # Not `python -m bench.harness --manifest ...`, for the reason the Makefile's bench
  # target spells out: stages.py caches phase congruency under (product_id, photometry
  # params, file size, int mtime, shape); every sweep fixture is product_id
  # "synth_source", 1474265 bytes, and several are written inside one wall-clock second,
  # so on a warm cache two pairs collide and the second reports the first one's numbers.
  # `rm -rf .cache` does not fix that — the harness warms the cache as it iterates.
  # SWEEP_CONFIG turns the cache off, which is what run_arms() already does and why
  # bench/baselines.md section 1 is correct; run_manifest() does not apply it and the CLI
  # exposes no way to pass it. Keep the two surfaces identical, or the container and the
  # laptop produce different tables. See docs/limitations.md section 9.
  bench:
    <<: *samanvay
    entrypoint: ["python", "-c"]
    command:
      - from bench.harness import run_manifest, SWEEP_CONFIG; run_manifest('fixtures/dsun_sweep/manifest.json', 'runs/sweep', SWEEP_CONFIG)

  test:
    <<: *samanvay
    entrypoint: ["python", "-m", "pytest"]
    command: ["-q"]

  airgap:
    <<: *samanvay
    entrypoint: ["python", "scripts/verify_airgap.py"]
    command: []

  # The only long-running service. Serves the repo root so viewer/index.html can fetch
  # runs/<id>/*.json — a file:// page cannot, which is the usual reason the viewer looks
  # empty. stdlib http.server: nothing to install, nothing listening beyond localhost.
  dashboard:
    <<: *samanvay
    entrypoint: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0"]
    command: []
    ports:
      - "8000:8000"
