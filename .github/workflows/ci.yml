name: CI

# main is always green (roadmap seat 5, gate M-any): lint, unit tests, and a
# real end-to-end registration on a 512x512 fixture, all under a few minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Verify MAGSAC++ is available (opencv-contrib)
        run: python -c "import cv2; assert hasattr(cv2, 'USAC_MAGSAC'), 'need opencv-contrib build'; print('MAGSAC++ OK', cv2.__version__)"

      - name: Lint (ruff)
        run: ruff check samanvay bench tests synth scripts

      - name: Unit tests (pytest)
        run: pytest

      - name: End-to-end smoke (512x512, < 5 min budget)
        run: python scripts/ci_smoke.py

      - name: Benchmark (informational)
        run: python -m bench.harness --quick

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/results/
          if-no-files-found: ignore
