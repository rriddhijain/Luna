# SAMANVAY CI — Seat 5 · deployment. The team rule is "main is always green".
#
# Nothing here is continue-on-error and nothing is `|| true`. A step that cannot pass fails
# the build, loudly, on the commit that broke it. A workflow that goes yellow instead of red
# is a workflow people stop reading.
#
# Three gates, in the order that fails cheapest first:
#   1. the pytest suite
#   2. an end-to-end smoke run on a small synthetic pair — the register CLI exits non-zero
#      by itself on a failed registration, so this step gates on the exit code plus the
#      artifacts on disk and the contract keys in metrics.json
#   3. scripts/verify_airgap.py — no external URL in any generated HTML, no import outside
#      requirements.lock
#
# Deliberately NOT gated: formatting, import order, type checks. Nobody ratified a style
# gate, and a red build for a stray blank line is how a team learns to ignore CI.
#
# Deliberately NOT gated: a numeric accuracy threshold. bench/baselines.md has real
# numbers now, but they are strongly delta-sun dependent (baselines.md section 1,
# 2026-09-02: pinned sift gives 9 inliers at 5.610 px at delta-sun 50 deg and no model at
# all from 60 deg up, while the auto default gives 99 inliers at 1.887 px and still
# delivers a model at 180 deg), so a single RMSE or inlier-ratio
# bar on one fixture would be a line drawn around one point of a curve. The smoke test
# asserts structure and the CLI's own exit code, not a quality claim. When a threshold
# is added it belongs per-pair against the sweep manifest, and it gets recorded in
# baselines.md.
#
# THIS WORKFLOW HAS NEVER EXECUTED ON GITHUB. It was written and reasoned about offline;
# the pytest and smoke-test bodies were run locally on macOS (2026-09-03: `.venv/bin/pytest
# -q` -> 429 passed, 0 failed in 56.7 s, and the fixture/register/assert sequence below,
# run by hand, exits 0 on fixtures/ci_smoke). The runner steps — checkout, setup-python,
# the pip install from requirements.lock, upload-artifact — were NOT run and cannot be
# run here. Push a branch and watch it go green before anyone says "CI is green".
#
# The one runner step nobody offline can check is the lock install: requirements.lock was
# generated on macOS/arm64 and CI installs it on linux/x86_64. Every pin is pure Python or
# ships a manylinux wheel, but "ships a wheel" was read off PyPI metadata, not observed.

name: ci

on:
  push:
  pull_request:

# A new push to the same ref cancels the old run; the last commit is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  MPLBACKEND: Agg          # matplotlib must never look for a display on a headless runner

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20    # backstop: a hung job dies rather than burning an hour

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 3.11, not "3.x": rasterio/GDAL and opencv-python-headless publish manylinux
          # wheels for 3.11 and none for 3.14. Same version as the dev venv and the image,
          # so CI is not a third environment nobody tests.
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked environment
        run: |
          python -m pip install --upgrade pip
          # --no-deps: requirements.lock is the full transitive closure. Letting pip resolve
          # pyproject's floors here would silently install something other than the pinned
          # versions and the word "locked" would stop meaning anything.
          #
          # The lock was generated on macOS/arm64. Every pin is either pure Python or ships
          # a linux x86_64 manylinux wheel; if this step ever fails on a missing wheel, fix
          # the pin, do not relax it to a range.
          pip install --no-deps -r requirements.lock
          pip install --no-deps -e .
          python -c "import cv2, rasterio, skimage, matplotlib, samanvay; print('env ok')"

      - name: Unit tests
        timeout-minutes: 10   # hard timeout: pytest-timeout is not a dependency, the runner enforces it
        run: pytest -q --durations=10

      # One step, one budget: generate a small synthetic pair, register it, prove the run
      # artifacts landed and that metrics.json carries the contract keys.
      - name: End-to-end smoke test
        timeout-minutes: 5
        run: |
          # 512, not 256. Measured here 2026-09-03: at 256 the pair registers with 6
          # inliers and check_status "skipped_too_few_matches" — the contract keys are all
          # present so the gate passes, but 6 inliers is two above the 4-point minimum for
          # a fit, and a small numerical difference on a linux runner could flip it to
          # verify_status=failed and turn CI red for no regression. At 512 the same pair
          # gives 29 inliers, check_status "ok" and check_rmse_px 1.7288, so the held-out
          # path this project's headline number comes from is actually exercised.
          # Cost: 16 s warm / 26 s cold instead of 6 s, inside the 5-minute step budget.
          samanvay fixture --out-dir fixtures/ci_smoke --size 512 --seed 0
          samanvay register \
            --source fixtures/ci_smoke/source.tif \
            --ref    fixtures/ci_smoke/reference.tif \
            --out    runs/ci_smoke
          python - <<'PY'
          import json, os, sys

          RUN = "runs/ci_smoke"
          # registered_source_grid.tif is here because output.grid defaults to "both":
          # dropping the source-resolution product silently is the defect it exists to
          # fix. metrics_report.pdf is deliberately NOT gated — it is contracted to
          # degrade to no-PDF with a recorded reason rather than fail a run.
          ARTIFACTS = ["registered.tif", "registered_source_grid.tif",
                       "matches.csv", "transform.json",
                       "metrics.json", "provenance.json", "report.html"]
          # Keys the metrics contract promises (docs/CONTRACTS.md section 1). A null value
          # is legal and honest — unknown quantities are reported as null; a MISSING key
          # is a contract break. check_* / sdi / tps_* / grid_rows / grid_cols /
          # match_method_resolved are the P1.4, uniformity and auto-resolution keys the
          # report and the docs are written against, so a regression that drops one
          # should fail here rather than in front of a judge.
          METRIC_KEYS = ["rmse_px", "inlier_count", "inlier_ratio",
                         "coverage_pct", "dispersion_cv", "grid_n", "runtime_s",
                         "grid_rows", "grid_cols", "sdi", "sdi_definition",
                         "check_rmse_px", "check_status", "n_check", "n_control",
                         "tps_status", "tps_applied", "inlier_ratio_pass",
                         "inlier_ratio_target", "match_method_resolved",
                         "verify_status", "seed_applied"]

          bad = [f for f in ARTIFACTS
                 if not os.path.isfile(os.path.join(RUN, f))
                 or os.path.getsize(os.path.join(RUN, f)) == 0]
          if bad:
              sys.exit(f"missing or empty run artifacts: {bad}")

          with open(os.path.join(RUN, "metrics.json")) as f:
              metrics = json.load(f)
          absent = [k for k in METRIC_KEYS if k not in metrics]
          if absent:
              sys.exit(f"metrics.json is missing contract keys: {absent}")

          # No verify_status check here: `samanvay register` exits non-zero itself when
          # verification fails, so the step above has already failed the build. Asserting
          # it a second time only meant two places to update when the contract moved.

          with open(os.path.join(RUN, "transform.json")) as f:
              params = json.load(f)["params"]
          if len(params) != 3 or any(len(row) != 3 for row in params):
              sys.exit(f"transform.json params is not 3x3: {params}")

          print("smoke ok:", {k: metrics[k] for k in METRIC_KEYS})
          PY

      # Runs last, and over a tree that now contains a freshly generated report.html — so
      # it checks the HTML the pipeline actually produces on this commit, not just the
      # HTML someone committed.
      - name: Air-gap gate
        run: python scripts/verify_airgap.py

      # Only on a red build: the run directory is what makes a CI-only failure debuggable.
      - name: Upload smoke run on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run
          path: runs/ci_smoke
          if-no-files-found: ignore
